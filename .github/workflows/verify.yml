name: 학습 앱 검증
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wordstudy_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wordstudy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordstudy_test -d wordstudy_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: wordStudy_
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wordStudy_/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm run verify:api
        env:
          DATABASE_URL: postgresql://wordstudy_test:ci-only-password@127.0.0.1:5432/wordstudy_test
      - name: HTML 및 Python 구문 검사
        run: |
          node scripts/verify-html.mjs
          python3 -m py_compile scripts/browser-preview.py ../scripts/update-html-manifest.py
