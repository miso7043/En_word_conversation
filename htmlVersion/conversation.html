<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 공부</title>
<style>
  :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101923; color: #f0f5f7; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .layout { display: grid; grid-template-columns: minmax(220px, 285px) minmax(0, 820px); justify-content: center; min-height: 100vh; }
  aside {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100dvh;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    padding: 30px 20px max(20px, env(safe-area-inset-bottom));
    background: #15222e;
    border-right: 1px solid #2c3d4b;
  }
  .lesson-list { overflow-y: auto; overscroll-behavior-y: contain; padding: 5px; margin-inline: -5px; }
  aside h1 { font-size: 1.15rem; margin: 0 0 24px; }
  nav { display: grid; gap: 8px; }
  button, .file-label { font: inherit; color: inherit; background: #203343; border: 1px solid #385263; border-radius: 9px; padding: 9px 13px; cursor: pointer; }
  button:hover:not(:disabled), .file-label:hover { background: #304858; }
  button:disabled { opacity: .48; cursor: default; }
  button:focus-visible, .file-label:focus-within { outline: 2px solid #86e2cf; outline-offset: 3px; }
  nav button { text-align: left; overflow-wrap: anywhere; }
  nav button[aria-current="true"] { border-color: #86e2cf; color: #a1efdf; background: #1d3e41; }
  nav small { display: block; margin-top: 4px; }
  small, .muted, .meaning, #load-status, #speech-status { color: #b4c6d1; }
  .file-label { display: inline-block; margin-bottom: 10px; font-size: .87rem; }
  .file-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #load-status { margin: 0 0 10px; font-size: .86rem; line-height: 1.6; }
  #load-status:empty { display: none; }
  main { padding: 0 clamp(14px, 4vw, 42px) 42px; min-width: 0; }
  .player { padding-top: 14px; margin-top: 10px; border-top: 1px solid #385263; text-align: center; }
  .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
  #play { display: grid; place-items: center; width: 44px; min-height: 44px; background: #86e2cf; color: #102721; }
  #play::before { content: ""; border-block: 8px solid transparent; border-left: 12px solid currentColor; margin-left: 2px; }
  #play[data-playing="true"]::before { width: 12px; height: 16px; margin: 0; border: solid currentColor; border-width: 0 4px; }
  #play:hover:not(:disabled) { background: #a1efdf; }
  #speech-status { margin: 7px 0 0; font-size: .84rem; }
  #speech-status:empty { margin: 0; }
  h2 { margin: 28px 0 12px; font-size: clamp(1.65rem, 4vw, 2.65rem); overflow-wrap: anywhere; }
  #content { line-height: 1.6; }
  article { margin-top: 16px; padding: 16px; border: 1px solid #2c3d4b; border-radius: 13px; background: #172532; }
  article h3 { margin: 0 0 5px; font-size: 1.05rem; }
  .cast { margin: 0 0 10px; font-size: .82rem; overflow-wrap: anywhere; }
  .line { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 9px; border-radius: 8px; }
  .line + .line { margin-top: 4px; }
  .speaker { align-self: start; min-width: 2em; padding: 2px 6px; text-align: center; border-radius: 6px; color: #a1efdf; background: #214246; }
  .meaning { display: block; margin-top: 2px; font-size: .9rem; }
  .reading { outline: 1px solid #86e2cf; background: #244048; }
  @media (max-width: 660px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    aside { position: static; height: auto; max-height: 60dvh; padding: 18px 14px; border-right: 0; border-bottom: 1px solid #2c3d4b; }
    aside h1 { margin-bottom: 12px; }
  }
  .study-tabs { display: flex; gap: 8px; max-width: 1105px; margin: 0 auto; padding: 10px 14px; }
  .study-tabs button { min-height: 44px; }
  .study-tabs [aria-selected="true"] { border-color: #86e2cf; color: #a1efdf; background: #1d3e41; }
  #dialogue-panel[hidden], #reader-panel[hidden] { display: none; }
  #reader-panel { max-width: 1105px; margin: 0 auto; }
  #reader-panel label[for="reader-text"] { display: block; margin-bottom: 8px; }
  #reader-text { display: block; width: 100%; min-height: clamp(16rem, 48vh, 32rem); padding: 12px; resize: vertical; font: inherit; color: inherit; background: #15222e; border: 1px solid #526777; border-radius: 9px; }
  #reader-text:focus-visible { outline: 2px solid #86e2cf; outline-offset: 3px; }
  #reader-panel .controls { justify-content: flex-start; margin-top: 12px; }
  .reader-repeat { display: inline-flex; align-items: center; gap: 6px; padding-inline: 8px; cursor: pointer; }
  #reader-panel button { min-height: 44px; }
  #reader-play { color: #102721; background: #86e2cf; }
  #reader-play:hover:not(:disabled) { background: #a1efdf; }
  #reader-status { color: #b4c6d1; overflow-wrap: anywhere; }

.study-header { max-width:1105px; margin:0 auto; padding:12px 14px; display:flex; flex-wrap:wrap; align-items:center; gap:16px; }.study-header h1 { font-size:1.25rem; margin:0; }
.study-options { max-width:1105px; margin:0 auto; padding:12px; border:1px solid #526777; border-radius:10px; }
.options-grid { display:flex; flex-wrap:wrap; gap:10px; padding-top:12px; }
.options-grid input[type=number] { width:5rem; }
input:not([type=checkbox]),select { font:inherit; padding:7px; background:#15222e;color:inherit;border:1px solid #526777;border-radius:6px; }
[hidden] { display:none !important; }
.lesson-row { display:flex;align-items:center;gap:8px; }.lesson-row button { flex:1; }
:root[data-theme=light] { color-scheme:light; background:#f4f7fa;color:#172b3a; }
:root[data-theme=light] :is(aside,article,button,.file-label,select,input,textarea,#reader-text) { background:#fff;color:#172b3a; }
:root[data-theme=light] :is(.muted,.meaning,.cast,small,#speech-status,#load-status,#reader-status) { color:#405466; }
:root[data-theme=light] .reading { background:#d8eef5; }
mark {background:#fae08a;color:#241f08;}
</style>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#15222e"></head>
<body>
<header class="study-header"><h1>영어 대화 연습</h1><label>테마 <select aria-label="테마" data-setting="theme"><option value="dark">어둡게</option><option value="light">밝게</option><option value="system">시스템</option></select></label></header>
<div class="study-tabs" role="tablist" aria-label="영어 학습 방식">
  <button type="button" role="tab" id="dialogue-tab" aria-selected="true" aria-controls="dialogue-panel">대화 연습</button>
  <button type="button" role="tab" id="reader-tab" aria-selected="false" aria-controls="reader-panel" tabindex="-1">문장 읽기</button>
</div>
<div class="layout" id="dialogue-panel" role="tabpanel" aria-labelledby="dialogue-tab">
  <aside>
    <div class="lesson-list">
      <nav id="lessons" aria-label="대화 목록"></nav>
    </div>
    <section class="player" aria-label="대화 및 음성 제어">
      <label class="file-label">JSON 폴더 열기 <input id="folder" type="file" webkitdirectory multiple></label>
      <p id="load-status" role="status"></p>
      <div class="controls">
        <button id="play" type="button" aria-label="재생" title="재생" disabled></button>
        <button id="stop" type="button" disabled>정지</button>
      </div>
      <p id="speech-status" role="status"></p>
    </section>
  </aside>
  <main>
    <div id="content"></div>
  </main>
</div>
<script src="./study.js"></script>
<script>
  const lessonList = document.querySelector('.lesson-list');
  const lessons = document.querySelector('#lessons');
  const content = document.querySelector('#content');
  const folder = document.querySelector('#folder');
  const loadStatus = document.querySelector('#load-status');
  const speechStatus = document.querySelector('#speech-status');
  const play = document.querySelector('#play');
  const stop = document.querySelector('#stop');
  const synth = window.speechSynthesis;
  const locales = new Set(['en-us', 'en-ca', 'en-gb', 'en-au', 'en-in']);
  const childVoice = /\b(?:child(?:ren)?|kid(?:s)?|junior|teen(?:ager)?|boy|girl|zippy|bahh|boing|bubbles|jester|good news|bad news|superstar)\b/i;
  const dateFormat = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', dateStyle: 'medium', timeStyle: 'short' });
  let documents = [];
  let selected = null;
  let cards = [];
  let lines = [];
  let voices = [];
  let lastVoiceReport;
  let current = 0;
  let state = 'idle';
  let utterance = null;
  let loadVersion = 0;
  let repeatCount = 0;
  let waiting = false;
  let playlistActive = false;
  const study = window.study;
  const config = study.settings;
  function savePosition() { if(selected) { const saved=study.read('html-progress-v1',{}); saved[selected.name]={position:current, line:lines[current] && {text:lines[current].text,speaker:lines[current].speaker}};study.write('html-progress-v1',saved); } }
  function filterLessons() {
    const query=study.query();let hidden=0;
    for(const item of documents) { const match=(!query.level || item.data.level===query.level) && [item.data.title,...[].concat(item.data.description||[])].join(' ').toLowerCase().includes(query.text);item.row.hidden=!match;if(!match&&study.checks.has(item.name))hidden++; }
    study.selection(hidden);
  }
  window.addEventListener('study-filter',filterLessons);
  window.addEventListener('study-settings',()=>{filterLessons();if(selected){for(const entry of lines){entry.english.replaceChildren();study.text(entry.english,entry.text,config.hideEnglish,entry.keyPhrase);if(entry.meaning){entry.meaning.replaceChildren();study.text(entry.meaning,entry.meaningText,config.hideMeaning);}}}});
  study.next(()=>{if(!lines.length||!voices.length)return;if(!lines[current]?.voice)assignVoices();utterance=null;synth?.cancel();waiting=false;repeatCount=0;current++;state='playing';speakCurrent();});
  function selectedPlaylist() { const list=documents.filter(item=>study.checks.has(item.name)&&item.data.conversations.some(c=>c.lines.length));return config.order==='reverse'?list.toReversed():list; }


  function add(parent, tag, text, className) {
    const element = document.createElement(tag);
    if (text != null) element.textContent = text;
    if (className) element.className = className;
    parent.append(element);
    return element;
  }

  function describe(parent, description) {
    for (const paragraph of [].concat(description || [])) {
      if (paragraph) add(parent, 'p', paragraph, 'muted');
    }
  }

  function shuffle(items) {
    for (let index = items.length - 1; index > 0; index--) {
      const other = Math.floor(Math.random() * (index + 1));
      [items[index], items[other]] = [items[other], items[index]];
    }
    return items;
  }

  function assignVoices() {
    const groups = new Map([...locales].map(locale => [locale, []]));
    for (const voice of voices) groups.get(voiceLocale(voice)).push(voice);
    const regions = [...groups.values()].filter(region => region.length);

    for (const card of cards) {
      const { speakers, cast, entries } = card;
      const queues = regions.map(region => shuffle([...region]));
      const pool = [];
      // Sample one voice per region before using a second from any region.
      while (queues.some(queue => queue.length)) {
        for (const queue of shuffle(queues)) {
          if (queue.length) pool.push(queue.pop());
        }
      }
      const previous = card.lastFirstVoice;
      if (pool.length > 1 && voiceKey(pool[0]) === previous) {
        [pool[0], pool[1]] = [pool[1], pool[0]];
      }
      const mapping = new Map(speakers.map((speaker, index) => [
        speaker, pool.length ? pool[index % pool.length] : undefined
      ]));
      for (const entry of entries) entry.voice = mapping.get(entry.speaker);
      const assignments = speakers.map(speaker => {
        const voice = mapping.get(speaker);
        return voice && `${speaker} · ${voice.name} (${voice.lang})`;
      });
      cast.textContent = voices.length ? assignments.join(' / ') : '';
    }
  }

  function updateControls() {
    play.disabled = !lines.length || !voices.length;
    const playing = state === 'playing';
    const action = playing ? '일시정지' : state === 'paused' ? '이어 듣기' : '재생';
    play.setAttribute('data-playing', String(playing));
    play.setAttribute('aria-label', action);
    play.title = action;
    lines.forEach((line, index) => {
      const active = state !== 'idle' && current === index;
      const lineAction = active ? action : '이 대사부터 재생';
      line.button.disabled = !line.voice;
      line.button.setAttribute('aria-label', `${line.speaker} · ${line.lineNumber}번째 대사 · ${lineAction}`);
      line.button.title = lineAction;
    });
    stop.disabled = state === 'idle';
    study.play(playing);
  }

  function voiceStatus() {
    if (!synth) return '이 브라우저는 음성 재생을 지원하지 않습니다.';
    if (!voices.length) return '사용 가능한 미국·캐나다·영국·호주·인도 영어 음성이 없습니다.';
    if (cards.some(card => card.speakers.length > voices.length)) {
      return '사용 가능한 영어 음성이 부족해 일부 화자가 같은 목소리를 사용합니다.';
    }
    return '';
  }

  function voiceLocale(voice) {
    try {
      const locale = new Intl.Locale(voice.lang.replaceAll('_', '-'));
      return `${locale.language}-${locale.region || ''}`.toLowerCase();
    } catch {
      return '';
    }
  }

  function voiceKey(voice) {
    return `${voiceLocale(voice)}:${voice.voiceURI || voice.name}`;
  }

  function refreshVoices() {
    const seen = new Set();
    const eligibleVoices = [];
    for (const voice of synth?.getVoices() || []) {
      const key = voiceKey(voice);
      if (!locales.has(voiceLocale(voice)) || childVoice.test(voice.name) || seen.has(key)) continue;
      eligibleVoices.push(voice);
      seen.add(key);
    }
    const report = eligibleVoices.map(({ name, lang }) => ({ name, lang }));
    const signature = JSON.stringify(report);
    if (signature !== lastVoiceReport) {
      lastVoiceReport = signature;
      console.info(`[영어 대화 연습] 재생 가능 음성 ${report.length}개`);
      if (report.length) console.table(report);
    }
    if (state !== 'idle') return;
    voices = eligibleVoices;
    assignVoices();
    updateControls();
    speechStatus.textContent = voiceStatus();
  }

  function resetPlayback(message) {
    const wasActive = state !== 'idle';
    state = 'idle';
    utterance = null;
    current = 0; repeatCount=0;waiting=false;study.play(false);
    if (wasActive) {
      synth.cancel();
      if (synth.paused) synth.resume();
    }
    for (const line of lines) line.element.classList.remove('reading');
    refreshVoices();
    if (message) speechStatus.textContent = message;
  }

  function speakCurrent() {
    if (current >= lines.length) {
      const list=selectedPlaylist(), index=list.indexOf(selected), next=playlistActive&&index>=0?list[index+1]:null;
      resetPlayback('재생이 끝났습니다.');savePosition();
      if(next){showDocument(next);current=0;startOrResume();}else playlistActive=false;
      return;
    }
    updateControls();
    const entry = lines[current];
    savePosition();
    if(config.role && entry.speaker===config.role && !waiting){waiting=true;state='paused';updateControls();speechStatus.textContent='내 차례입니다. 말해 보기 또는 다음 문장을 누르세요.';return;}
    waiting=false;
    entry.element.classList.add('reading');
    entry.element.scrollIntoView({
      behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
      block: 'center'
    });
    speechStatus.textContent = `읽는 중 · ${current + 1} / ${lines.length}`;
    const next = new SpeechSynthesisUtterance(entry.text);
    next.voice = entry.voice;
    next.lang = entry.voice.lang;
    next.rate = config.rate;
    utterance = next;
    next.onend = () => {
      if (utterance !== next) return;
      utterance = null;
      entry.element.classList.remove('reading');
      repeatCount++;
      if(repeatCount>=config.repeat){repeatCount=0;current++;}
      if (state === 'playing') speakCurrent();
      else updateControls();
    };
    next.onerror = () => {
      if (utterance === next) resetPlayback('음성 재생 중 오류가 발생했습니다.');
    };
    synth.speak(next);
  }

  function startOrResume() {
    if(waiting){waiting=false;current++;}
    if (state === 'idle') {
      assignVoices();
      for (const card of cards) {
        const firstVoice = card.entries[0]?.voice;
        if (firstVoice) card.lastFirstVoice = voiceKey(firstVoice);
      }
    }
    state = 'playing';
    updateControls();
    if (utterance) {
      synth.resume();
      speechStatus.textContent = `읽는 중 · ${current + 1} / ${lines.length}`;
    } else {
      if (synth.paused) synth.resume();
      speakCurrent();
    }
  }
  function togglePlayback() {
    if (state !== 'playing') {
      startOrResume();
      return;
    }
    state = 'paused';
    utterance=null;synth.cancel();
    updateControls();
    speechStatus.textContent = '일시정지됨';
  }
  play.addEventListener('click', () => {
    if(state==='idle' && study.checks.size){const first=selectedPlaylist()[0];if(first){if(selected!==first)showDocument(first);current=0;playlistActive=true;}}
    togglePlayback();
  });
  stop.addEventListener('click', () => {
    playlistActive=false;resetPlayback('재생을 정지했습니다.');savePosition();
    window.scrollTo(0, 0);
  });
  synth?.addEventListener('voiceschanged', refreshVoices);
  window.addEventListener('pagehide', () => resetPlayback());

  function showDocument(item) {
    resetPlayback();
    selected = item;
    for (const lesson of documents) {
      lesson.button.setAttribute('aria-current', String(lesson === item));
    }
    content.replaceChildren();
    cards = [];
    lines = [];
    add(content, 'h2', item.data.title);
    describe(content, item.data.description);
    item.data.conversations.forEach((conversation, index) => {
      const article = add(content, 'article');
      add(article, 'h3', conversation.title || `대화 ${conversation.id ?? index + 1}`);
      describe(article, conversation.description);
      const cast = add(article, 'p', '', 'cast muted');
      const entries = conversation.lines.map((line, lineIndex) => {
        const element = add(article, 'div', null, 'line');
        const button = add(element, 'button', line.speaker, 'speaker');
        button.type = 'button';
        const position = lines.length + lineIndex;
        button.addEventListener('click', () => {
          if (state !== 'idle' && current === position) {
            togglePlayback();
            return;
          }
          resetPlayback();
          if (button.disabled) return;
          current = position;
          startOrResume();
        });
        const dialogue = add(element, 'div');
        const english=add(dialogue,'span');english.lang='en';study.text(english,line.text,config.hideEnglish,line.keyPhrase);
        const meaning=line.meaning?add(dialogue,'span',null,'meaning'):null;
        if(meaning)study.text(meaning,line.meaning,config.hideMeaning);
        study.shadow(dialogue,line.text,()=>{if(state==='playing'){state='paused';utterance=null;synth?.cancel();updateControls();}});
        return { element, button, english, meaning, meaningText:line.meaning,keyPhrase:line.keyPhrase,text: line.text, speaker: line.speaker, lineNumber: lineIndex + 1 };
      });
      const speakers = [...new Set(entries.map(entry => entry.speaker))];
      cards.push({ cast, entries, speakers });
      lines.push(...entries);
    });
    study.resetRole([...new Set(lines.map(entry=>entry.speaker))],lines.length);
    const saved=study.read('html-progress-v1',{})[item.name];
    if(saved){const matches=lines.flatMap((entry,i)=>entry.text===saved.line?.text&&entry.speaker===saved.line?.speaker?[i]:[]);current=matches.length?matches.reduce((a,b)=>Math.abs(a-saved.position)<=Math.abs(b-saved.position)?a:b):Math.max(0,Math.min(Number.isInteger(saved.position)?saved.position:0,lines.length-1));}
    refreshVoices();
    window.scrollTo(0, 0);
  }

  function readDocument(data, name, modified) {
    if (typeof data?.title !== 'string' || !Array.isArray(data.conversations) ||
        !data.conversations.every(conversation => Array.isArray(conversation?.lines) &&
          conversation.lines.every(line => typeof line?.text === 'string' && typeof line.speaker === 'string'))) {
      throw new Error('대화 JSON 형식이 올바르지 않습니다.');
    }
    if(data.level!=null && !/^[ABC][12]$/.test(data.level))throw new Error('level은 A1~C2입니다.');
    for(const dialogue of data.conversations)for(const line of dialogue.lines)if(line.keyPhrase!=null && !(typeof line.keyPhrase==='string'||Array.isArray(line.keyPhrase)&&line.keyPhrase.every(p=>typeof p==='string')))throw new Error('keyPhrase 형식을 확인하세요.');
    return { data, name, date: Date.parse(data.date) || modified || 0 };
  }

  async function loadDocuments(sources, prune=true) {
    const version = ++loadVersion;
    loadStatus.textContent = '대화 목록을 불러오는 중입니다.';
    const results = await Promise.allSettled(sources.map(source => source.read()));
    if (version !== loadVersion) return;
    const loaded = results.filter(result => result.status === 'fulfilled').map(result => result.value);
    const failed = sources.filter((_, index) => results[index].status === 'rejected').map(source => source.name);
    if (loaded.length) {
      resetPlayback();
      documents = loaded.sort((a, b) => b.date - a.date || a.name.localeCompare(b.name));
      lessons.replaceChildren();
      for (const item of documents) {
        item.row=add(lessons,'div',null,'lesson-row');const check=add(item.row,'input');check.type='checkbox';check.checked=study.checks.has(item.name);check.setAttribute('aria-label',`${item.data.title} 연속 재생 선택`);check.onchange=()=>{if(check.checked)study.checks.add(item.name);else study.checks.delete(item.name);study.write('html-selection-v1',[...study.checks]);filterLessons();};
        item.button = add(item.row, 'button', item.data.title);
        if (item.date) add(item.button, 'small', dateFormat.format(item.date));
        item.button.addEventListener('click', () => {playlistActive=false;showDocument(item);});
      }
      const valid=new Set(documents.map(item=>item.name));if(prune && !failed.length)for(const id of study.checks)if(!valid.has(id))study.checks.delete(id);study.write('html-selection-v1',[...study.checks]);
      filterLessons();
      showDocument(documents[0]);
      lessonList.scrollTop = 0;
    }
    loadStatus.textContent = failed.length ? `불러오지 못한 파일: ${failed.join(', ')}` : '';
    if (!loaded.length) {
      loadStatus.textContent += ' JSON 폴더 열기를 눌러 프로젝트의 json 폴더를 선택하세요.';

    const sources = [...folder.files].filter(file => /\.json$/i.test(file.name)).map(file => ({

    }));
    loadDocuments(sources);
    folder.value = '';
  });

  async function loadFromServer() {
    const directory = new URL('./json/', location.href);
    let urls;
    const version = loadVersion;
    try {
      let manifest;
      try { const response=await fetch(new URL('./lessons.json',location.href),{cache:'no-cache'});if(response.ok)manifest=await response.json(); } catch {}
      if(Array.isArray(manifest)&&manifest.length){urls=manifest.map(name=>new URL(encodeURIComponent(name),directory));}
      const index = urls ? null : await fetch(directory, { cache: 'no-cache' });
      if(urls) { /* 자료 목록 manifest 우선 */ } else {
      if (!index.ok) throw new Error(`HTTP ${index.status}`);
      const listing = new DOMParser().parseFromString(await index.text(), 'text/html');
      const discovered = [...listing.querySelectorAll('a[href]')].map(link => new URL(link.getAttribute('href'), directory))
        .filter(url => /\.json$/i.test(url.pathname) && new URL('.', url).href === directory.href);
      urls = [...new Map(discovered.map(url => [url.pathname, url])).values()];
      if (!urls.length) throw new Error('JSON 목록이 비어 있습니다.');
      }
    } catch {
      if (version === loadVersion) {
        loadStatus.textContent = '서버에서 json 폴더 목록을 읽을 수 없습니다. JSON 폴더 열기를 사용하세요.';
      }
      return;
    }
    if (version !== loadVersion) return;
    loadDocuments(urls.map(url => {
      const name = decodeURIComponent(url.pathname.split('/').pop());
      return {
        name,
        read: async () => {
          try { const response = await fetch(url, { cache: 'no-cache' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return readDocument(await response.json(), name, Date.parse(response.headers.get('Last-Modified'))); }
          catch(error){throw error;}
        }
      };
    }));
  }

<script>
  {
    const input = document.querySelector('#reader-text');
    input.value=window.study.read('html-reader-text-v1','');
    input.addEventListener('input',()=>window.study.write('html-reader-text-v1',input.value));
    const play = document.querySelector('#reader-play');
    const stop = document.querySelector('#reader-stop');
    const status = document.querySelector('#reader-status');
    const repeat = document.querySelector('#reader-repeat');
    const synth = window.speechSynthesis;
    let active = null;
    let previousVoice = '';

    const voiceKey = voice => voice.voiceURI || `${voice.name}:${voice.lang}`;

    function englishVoices() {
      const voices = new Map();
      for (const voice of synth?.getVoices() ?? []) {
        if (/^en(?:[-_]|$)/i.test(voice.lang)) voices.set(voiceKey(voice), voice);
      }
      return [...voices.values()];
    }

    function refresh() {
      const count = englishVoices().length;
      play.disabled = !count || !input.value.trim();
      if (active) return;
      status.textContent = !synth ? '이 브라우저는 음성 재생을 지원하지 않습니다.'
        : count ? `사용 가능한 영어 목소리 ${count}개 · 재생할 때 무작위로 선택합니다.`
        : '사용 가능한 영어 목소리가 아직 없습니다.';
    }

    function cancel() {
      if (active) {
        active = null;
        synth.cancel();
      }
      stop.disabled = true;window.study.play(false);
    }

    function speakText(text, voices) {
      const alternatives = voices.filter(voice => voiceKey(voice) !== previousVoice);
      const pool = alternatives.length ? alternatives : voices;
      const voice = pool[Math.floor(Math.random() * pool.length)];
      previousVoice = voiceKey(voice);

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.voice = voice;
      utterance.lang = voice.lang.replaceAll('_', '-');
      utterance.rate = window.study.settings.rate;
      window.study.play(true);
      active = utterance;
      stop.disabled = false;
      const label = `${voice.name} (${voice.lang})`;
      status.textContent = `재생 중 · ${label}`;

      function finish(message) {
        if (active !== utterance) return;
        active = null;
        stop.disabled = true;window.study.play(false);
        status.textContent = `${message} · ${label}`;
      }

      utterance.onend = () => {
        if (active !== utterance) return;
        if (repeat.checked) speakText(text, voices);
        else finish('재생 완료');
      };
      utterance.onerror = () => finish('음성 재생 중 오류가 발생했습니다');
      synth.speak(utterance);
    }

    play.addEventListener('click', () => {
      const text = input.value.trim();
      const voices = englishVoices();
      if (!text || !voices.length) {
        refresh();
        return;
      }
      cancel();
      speakText(text, voices);
    });

    stop.addEventListener('click', () => {
      cancel();
      status.textContent = '재생을 정지했습니다.';
    });
    input.addEventListener('input', refresh);
    synth?.addEventListener('voiceschanged', refresh);
    window.addEventListener('pagehide', cancel);

    const tabs = [...document.querySelectorAll('.study-tabs [role="tab"]')];
    let selectedTab = tabs[0];
    function selectTab(tab) {
      if (tab === selectedTab) return;
      if (selectedTab === tabs[0] && state !== 'idle') resetPlayback();
      if (selectedTab === tabs[1]) {
        cancel();
        refresh();
      }
      selectedTab = tab;
      for (const item of tabs) {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
        document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
      }
      window.scrollTo(0, 0);
    }

    for (const [index, tab] of tabs.entries()) {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', event => {
        const nextIndex = { ArrowLeft: 1 - index, ArrowRight: 1 - index, Home: 0, End: 1 }[event.key];
        if (nextIndex === undefined) return;
        event.preventDefault();
        selectTab(tabs[nextIndex]);
        tabs[nextIndex].focus();
      });
    }
    refresh();
  }
</script>
</body>
</html>
